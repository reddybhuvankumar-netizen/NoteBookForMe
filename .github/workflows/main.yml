```yaml
name: Build NoteBookForMe APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev \
            libssl-dev build-essential

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer "cython==0.29.36"

      - name: Configure Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "PATH=$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH" >> "$GITHUB_ENV"

      - name: Install Android command-line tools
        run: |
          SDK="$ANDROID_HOME"
          mkdir -p "$SDK/cmdline-tools"
          cd "$RUNNER_TEMP"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p "$SDK/cmdline-tools/latest"
          cp -r cmdline-tools/. "$SDK/cmdline-tools/latest/"

      - name: Accept licenses and install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoteBookForMe-APK
          path: bin/*.apk
          if-no-files-found: error
```
