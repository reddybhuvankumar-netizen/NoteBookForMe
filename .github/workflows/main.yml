name: Build NoteBookForMe APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev \
            libssl-dev build-essential libltdl-dev \
            libsqlite3-dev

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            cmdline-tools;latest

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer "cython==0.29.36"

      - name: Configure Buildozer SDK
        shell: bash
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$(dirname "$SDK")"

          if [ -e "$SDK" ] || [ -L "$SDK" ]; then
            rm -rf "$SDK"
          fi

          ln -s "$ANDROID_HOME" "$SDK"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -path '*/bin/sdkmanager' \
            -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          mkdir -p "$SDK/tools/bin"
          ln -sf "$SDKMANAGER" "$SDK/tools/bin/sdkmanager"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoteBookForMe-APK
          path: bin/*.apk
          if-no-files-found: error
