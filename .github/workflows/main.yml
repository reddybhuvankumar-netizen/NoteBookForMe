
name: Build NoteBookForMe APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest"

      - name: Install Buildozer
        run: |
          pip install --user --upgrade buildozer "cython==0.29.36"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoteBookForMe-APK
          path: bin/*.apk
          if-no-files-found: error
